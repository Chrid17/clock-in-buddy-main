name: clock_in_buddy
description: "Remote Clock In - Track your time with photo and location verification"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Supabase
  supabase_flutter: ^2.3.0
  
  # State management
  provider: ^6.1.1
  
  # Camera
  camera: ^0.10.5+5
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  odoo_rpc: ^0.7.1
  csv: ^6.0.0
  file_picker: ^8.0.0+1
  
  # Platform specific
  camera_windows: ^0.2.1+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
