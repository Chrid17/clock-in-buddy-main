name: clock_in_buddy
description: "Clock In Buddy: remote clock-in with photo verification, GPS proof and a REST backend."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Backend: Supabase auth; data goes through the REST client in lib/src/api
  supabase_flutter: ^2.18.3
  http: ^1.4.0

  # State
  provider: ^6.1.5

  # Proof of attendance
  camera: ^0.12.1
  geolocator: ^14.1.2
  crypto: ^3.0.6

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  image_path_ios: "assets/icon/app_icon_square.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
